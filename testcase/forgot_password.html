<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodKnight | Forgot Password</title>
    <link rel="icon" type="image/png" href="assets/knight-shield.png">
    <link rel="shortcut icon" type="image/png" href="assets/knight-shield.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            transition: background-color 0.3s, color 0.3s;
        }
        body.dark {
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white text-xl mx-auto mb-4 shadow-lg shadow-red-200/30 dark:shadow-red-900/20">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Forgot Password?</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <form onsubmit="handleForgotPassword(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required 
                       class="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-red-500 dark:focus:ring-red-600 outline-none transition-colors">
            </div>

            <button type="submit" class="w-full bg-red-600 dark:bg-red-600 hover:bg-red-700 dark:hover:bg-red-700 text-white py-3 rounded-xl font-bold transition-colors shadow-md shadow-red-200/30 dark:shadow-red-900/20">
                <i class="fas fa-paper-plane mr-2"></i> Send Reset Link
            </button>
        </form>

        <div id="msg" class="text-center mt-4 text-sm font-medium min-h-[20px]"></div>

        <p class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400">
            Remember your password? <a href="index.html" class="text-red-600 dark:text-red-400 font-bold hover:underline">Sign in</a>
        </p>
    </div>

    <script>
        // Load theme preference from localStorage (synced with index.html/dashboards)
        // This page does NOT have a theme toggle - it only syncs with saved preference
        // Apply theme immediately before DOMContentLoaded to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('bloodknight-theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('bloodknight-theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
            }
        });

        // Get user_type from URL parameter (donor or hospital)
        const urlParams = new URLSearchParams(window.location.search);
        const userType = urlParams.get('user_type') || 'donor'; // Default to donor
        
        // Store user_type in a hidden input for form submission
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'user_type';
            hiddenInput.value = userType;
            form.appendChild(hiddenInput);
        });

        async function handleForgotPassword(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('msg');
            const formData = new FormData(e.target);
            formData.append('action', 'forgot_password');
            
            // Get user_type from URL params or form data
            const urlParams = new URLSearchParams(window.location.search);
            const userTypeFromUrl = urlParams.get('user_type') || 'donor';
            const userType = formData.get('user_type') || userTypeFromUrl;
            
            // Ensure user_type is in formData
            if (!formData.get('user_type')) {
                formData.set('user_type', userType);
            }
            
            // Determine which backend to call based on user_type
            const backendUrl = userType === 'hospital' ? 'admin_controller.php' : 'bloodknight.php';

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Sending...';
            msg.innerText = "";

            try {
                const response = await fetch(backendUrl, { 
                    method: 'POST', 
                    body: formData,
                    credentials: 'same-origin' // Include cookies
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('Response is not JSON:', responseText);
                    throw new Error('Server error: ' + responseText.substring(0, 100));
                }

                if (result.status === 'success') {
                    msg.className = 'text-green-600 dark:text-green-400';
                    msg.innerText = result.message || "Password reset link sent to your email!";
                    e.target.reset();
                } else {
                    msg.className = 'text-red-600 dark:text-red-400';
                    msg.innerText = result.message || "Failed to send reset link.";
                }
            } catch (error) {
                msg.className = 'text-red-600 dark:text-red-400';
                msg.innerText = "Connection error. Please try again.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Send Reset Link';
            }
        }
    </script>
</body>
</html>
