<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - BloodKnight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Dark Mode Styles - Matching dashboard color palette */
        body.dark-mode {
            background-color: #1a2332;
            color: #e8f0f8;
        }
        
        /* Override Tailwind dark mode colors to match dashboard palette */
        body.dark .dark\:bg-slate-900 {
            background-color: #1a2332 !important;
        }
        body.dark .dark\:bg-slate-800 {
            background-color: #2d4a5f !important;
        }
        body.dark .dark\:bg-slate-700 {
            background-color: #243447 !important;
        }
        body.dark .dark\:text-slate-200,
        body.dark .dark\:text-slate-300,
        body.dark .dark\:text-white {
            color: #e8f0f8 !important;
        }
        body.dark .dark\:text-slate-400 {
            color: #a8b8c8 !important;
        }
        body.dark .dark\:border-slate-700,
        body.dark .dark\:border-slate-600 {
            border-color: #4a5f7a !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-red-600 rounded-xl flex items-center justify-center text-white text-xl mx-auto mb-4 shadow-md shadow-red-200/30 dark:shadow-red-900/20">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Reset Password</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Enter your new password below.</p>
        </div>

        <form onsubmit="handleResetPassword(event)" class="space-y-4">
            <input type="hidden" name="token" id="reset-token" value="">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">New Password</label>
                <input type="password" name="password" required minlength="6" class="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-red-500 dark:focus:ring-red-600 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required minlength="6" class="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-red-500 dark:focus:ring-red-600 outline-none">
            </div>

            <button type="submit" class="w-full bg-slate-900 dark:bg-slate-800 hover:bg-slate-800 dark:hover:bg-slate-700 text-white py-3 rounded-xl font-bold transition-colors shadow-md shadow-slate-200/30 dark:shadow-slate-900/20">
                <i class="fas fa-check mr-2"></i> Reset Password
            </button>
        </form>

        <div id="msg" class="text-center mt-4 text-sm font-medium min-h-[20px]"></div>

        <p class="text-center mt-6 text-sm text-slate-500 dark:text-slate-400">
            <a href="index.html" class="text-red-600 dark:text-red-400 font-bold hover:underline">Back to Login</a>
        </p>
    </div>

    <script>
        // Load theme preference from localStorage (synced with other dashboards/index.html)
        // Note: This page does NOT allow toggling theme - it only syncs with saved preference
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('bloodknight-theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode', 'dark');
            } else {
                document.body.classList.remove('dark-mode', 'dark');
            }
        });

        // Get token and user_type from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const userType = urlParams.get('user_type') || 'donor'; // Default to donor if not specified
        
        if (token) {
            document.getElementById('reset-token').value = token;
        } else {
            document.getElementById('msg').innerHTML = '<span class="text-red-600 dark:text-red-400">Invalid or missing reset token.</span>';
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('msg');
            const formData = new FormData(e.target);
            
            if (formData.get('password') !== formData.get('confirm_password')) {
                msg.className = 'text-red-600 dark:text-red-400';
                msg.innerText = "Passwords do not match!";
                return;
            }

            formData.append('action', 'reset_password');
            
            // Determine which backend to call and where to redirect based on user_type
            const userTypeParam = urlParams.get('user_type') || 'donor';
            const backendUrl = userTypeParam === 'hospital' ? 'admin_controller.php' : 'bloodknight.php';
            const redirectUrl = userTypeParam === 'hospital' ? 'admin_dashboard.html' : 'dashboard.html';

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Resetting...';
            msg.innerText = "";

            try {
                const response = await fetch(backendUrl, { method: 'POST', body: formData });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('Response is not JSON:', responseText);
                    throw new Error('Server error: ' + responseText.substring(0, 100));
                }

                if (result.status === 'success') {
                    msg.className = 'text-green-600 dark:text-green-400';
                    msg.innerText = result.message || "Password reset successfully! Redirecting to dashboard...";
                    setTimeout(() => window.location.href = redirectUrl, 2000);
                } else {
                    msg.className = 'text-red-600 dark:text-red-400';
                    msg.innerText = result.message || "Failed to reset password.";
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i> Reset Password';
                }
            } catch (error) {
                console.error('Reset password error:', error);
                msg.className = 'text-red-600 dark:text-red-400';
                msg.innerText = "Connection error: " + error.message + ". Please try again.";
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check mr-2"></i> Reset Password';
            }
        }
    </script>
</body>
</html>
