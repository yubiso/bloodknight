<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BloodKnight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <nav class="w-full bg-white border-b border-slate-200 px-6 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <i class="fas fa-shield-alt text-red-600 text-2xl"></i>
                <span class="text-xl font-bold text-slate-800 tracking-tight">BloodKnight</span>
            </a>
            <a href="login.html" class="text-sm font-bold text-slate-500 hover:text-red-600">Already a member?</a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-xl w-full">
            
            <div id="step1" class="text-center">
                <h1 class="text-3xl font-bold text-slate-900 mb-8">Join the Initiative</h1>
                
                <label class="cursor-pointer block mb-6 group">
                    <input type="radio" name="role" value="donor" class="peer sr-only" checked>
                    <div class="bg-white border-2 border-slate-200 peer-checked:border-red-600 peer-checked:bg-red-50 rounded-2xl p-6 flex items-center gap-4 transition-all shadow-sm hover:shadow-md">
                        <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-xl">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="text-left">
                            <h3 class="font-bold text-slate-900">I am a Donor</h3>
                            <p class="text-sm text-slate-500">I want to find drives and track my impact.</p>
                        </div>
                        <i class="fas fa-check-circle text-red-600 text-xl ml-auto opacity-0 peer-checked:opacity-100"></i>
                    </div>
                </label>

                <button onclick="goToStep2()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-colors">
                    Continue <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>

            <div id="step2" class="hidden fade-in bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">Create Donor Profile</h2>
                    <button onclick="location.reload()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase">Cancel</button>
                </div>
                
                <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4">
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                        <input type="text" name="full_name" required class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-red-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <input type="email" name="email" required class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-red-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Gender</label>
                            <select name="gender" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 outline-none">
                                <option value="">Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
                            <input type="text" name="phone" placeholder="012-3456789" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Blood Type</label>
                        <select name="blood_type" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 outline-none">
                            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" name="password" required class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-red-500 outline-none" placeholder="Min 8 chars, 1 Upper, 1 Number">
                        <p class="text-xs text-slate-400 mt-1">Must contain: 8+ characters, 1 Uppercase, 1 Number.</p>
                    </div>

                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-bold transition-colors mt-4 shadow-lg shadow-red-200">
                        Send Verification Code
                    </button>
                </form>
                
                <div id="msg" class="text-center mt-4 text-sm font-bold"></div>
            </div>

            <div id="step3" class="hidden fade-in bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold">Verify Email</h2>
                    <button onclick="goBackToStep2()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase">Back</button>
                </div>
                
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-envelope text-red-600 text-2xl"></i>
                    </div>
                    <p class="text-slate-600 mb-2">We've sent a verification code to</p>
                    <p class="font-bold text-slate-900" id="otp-email-display"></p>
                    <p class="text-sm text-slate-400 mt-2">Please check your email and enter the code below</p>
                </div>
                
                <form id="otpForm" onsubmit="handleOTPVerification(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Verification Code</label>
                        <input type="text" name="otp" id="otp-input" required maxlength="6" pattern="[0-9]{6}" class="w-full p-3 bg-slate-50 rounded-lg border border-slate-200 focus:ring-2 focus:ring-red-500 outline-none text-center text-2xl tracking-widest font-mono" placeholder="000000">
                        <p class="text-xs text-slate-400 mt-1 text-center">Enter the 6-digit code</p>
                    </div>

                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-bold transition-colors mt-4 shadow-lg shadow-red-200">
                        Verify & Create Account
                    </button>
                    
                    <div class="text-center">
                        <button type="button" onclick="resendOTP()" class="text-sm text-slate-500 hover:text-red-600 font-medium">
                            <i class="fas fa-redo mr-1"></i> Resend Code
                        </button>
                    </div>
                </form>
                
                <div id="otp-msg" class="text-center mt-4 text-sm font-bold"></div>
            </div>

        </div>
    </main>

    <script>
        let registrationData = {};
        let verificationToken = '';

        function goToStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function goToStep3(email) {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            document.getElementById('otp-email-display').textContent = email;
            document.getElementById('otp-input').focus();
        }

        function goBackToStep2() {
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('otp-msg').innerText = '';
            document.getElementById('otp-input').value = '';
        }

        // RESET BUTTON ON BACK NAVIGATION
        window.addEventListener('pageshow', function(event) {
            const btn = document.querySelector('button[type="submit"]');
            if(btn) {
                btn.disabled = false;
                if(btn.innerText.includes('Processing')) btn.innerText = 'Send Verification Code';
            }
        });

        async function handleSignup(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('msg');
            
            // --- 0. VERIFY reCAPTCHA ---
            const recaptchaResponse = grecaptcha.getResponse();
            if (!recaptchaResponse) {
                msg.className = 'text-red-600';
                msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please complete the reCAPTCHA verification';
                return;
            }
            
            const formData = new FormData(e.target);

            // --- 1. PASSWORD CHECK (Display error on screen) ---
            const password = formData.get('password');
            const requirementRegex = /^(?=.*\d)(?=.*[A-Z]).{8,}$/;
            if (!requirementRegex.test(password)) {
                msg.className = 'text-red-600';
                msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Weak Password! Needs 1 Uppercase & 1 Number.';
                grecaptcha.reset();
                return; // Stop here if password is weak
            }

            // --- 2. SAVE REGISTRATION DATA ---
            registrationData = {
                full_name: formData.get('full_name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                gender: formData.get('gender'),
                blood_type: formData.get('blood_type'),
                password: password
            };

            // --- 3. UI LOADING STATE ---
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending Code...';
            msg.innerText = "";

            // --- 4. SEND OTP ---
            const otpFormData = new FormData();
            otpFormData.append('action', 'send_otp');
            otpFormData.append('email', registrationData.email);
            otpFormData.append('full_name', registrationData.full_name);
            otpFormData.append('g-recaptcha-response', recaptchaResponse);

            try {
                const response = await fetch('bloodknight.php', { method: 'POST', body: otpFormData });
                
                if (!response.ok) throw new Error("Backend Offline");
                
                const result = await response.json();

                if (result.status === 'success') {
                    msg.className = 'text-green-600';
                    msg.innerText = "Verification code sent!";
                    setTimeout(() => {
                        goToStep3(registrationData.email);
                    }, 500);
                } else {
                    msg.className = 'text-red-600';
                    msg.innerText = result.message;
                    btn.disabled = false;
                    btn.innerText = 'Send Verification Code';
                }
            } catch (error) {
                msg.className = 'text-red-600';
                msg.innerText = "Failed to send verification code. Please try again.";
                btn.disabled = false;
                btn.innerText = 'Send Verification Code';
            }
        }

        async function handleOTPVerification(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const msg = document.getElementById('otp-msg');
            const otp = document.getElementById('otp-input').value.trim();

            if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
                msg.className = 'text-red-600';
                msg.innerText = "Please enter a valid 6-digit code";
                return;
            }

            // --- 1. VERIFY OTP ---
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            msg.innerText = "";

            const verifyFormData = new FormData();
            verifyFormData.append('action', 'verify_otp');
            verifyFormData.append('email', registrationData.email);
            verifyFormData.append('otp', otp);

            try {
                const response = await fetch('bloodknight.php', { method: 'POST', body: verifyFormData });
                
                if (!response.ok) throw new Error("Backend Offline");
                
                const result = await response.json();

                if (result.status === 'success') {
                    verificationToken = result.data.verification_token;
                    
                    // --- 2. COMPLETE REGISTRATION ---
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
                    
                    const registerFormData = new FormData();
                    registerFormData.append('action', 'register_donor');
                    registerFormData.append('full_name', registrationData.full_name);
                    registerFormData.append('email', registrationData.email);
                    registerFormData.append('password', registrationData.password);
                    registerFormData.append('blood_type', registrationData.blood_type);
                    registerFormData.append('phone', registrationData.phone);
                    registerFormData.append('gender', registrationData.gender);
                    registerFormData.append('verification_token', verificationToken);

                    const registerResponse = await fetch('bloodknight.php', { method: 'POST', body: registerFormData });
                    
                    if (!registerResponse.ok) throw new Error("Backend Offline");
                    
                    const registerResult = await registerResponse.json();

                    if (registerResult.status === 'success') {
                        // Save to localStorage for profile page
                        const userProfile = {
                            full_name: registrationData.full_name,
                            email: registrationData.email,
                            phone: registrationData.phone,
                            gender: registrationData.gender,
                            blood_type: registrationData.blood_type,
                            profile_pic: ""
                        };
                        localStorage.setItem('bk_user_profile', JSON.stringify(userProfile));

                        msg.className = 'text-green-600';
                        msg.innerText = "Account created! Redirecting...";
                        setTimeout(() => window.location.href = 'dashboard.html', 1500);
                    } else {
                        msg.className = 'text-red-600';
                        msg.innerText = registerResult.message;
                        btn.disabled = false;
                        btn.innerText = 'Verify & Create Account';
                    }
                } else {
                    msg.className = 'text-red-600';
                    msg.innerText = result.message;
                    btn.disabled = false;
                    btn.innerText = 'Verify & Create Account';
                }
            } catch (error) {
                msg.className = 'text-red-600';
                msg.innerText = "Verification failed. Please try again.";
                btn.disabled = false;
                btn.innerText = 'Verify & Create Account';
            }
        }

        async function resendOTP() {
            const msg = document.getElementById('otp-msg');
            const resendBtn = document.querySelector('button[onclick="resendOTP()"]');
            
            resendBtn.disabled = true;
            resendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            msg.innerText = "";

            const otpFormData = new FormData();
            otpFormData.append('action', 'send_otp');
            otpFormData.append('email', registrationData.email);
            otpFormData.append('full_name', registrationData.full_name);

            try {
                const response = await fetch('bloodknight.php', { method: 'POST', body: otpFormData });
                const result = await response.json();

                if (result.status === 'success') {
                    msg.className = 'text-green-600';
                    msg.innerText = "New verification code sent!";
                    document.getElementById('otp-input').value = '';
                    document.getElementById('otp-input').focus();
                } else {
                    msg.className = 'text-red-600';
                    msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'text-red-600';
                msg.innerText = "Failed to resend code. Please try again.";
            } finally {
                resendBtn.disabled = false;
                resendBtn.innerHTML = '<i class="fas fa-redo mr-1"></i> Resend Code';
            }
        }

        // Auto-format OTP input (numbers only, max 6 digits)
        document.addEventListener('DOMContentLoaded', function() {
            const otpInput = document.getElementById('otp-input');
            if (otpInput) {
                otpInput.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
                });
            }
        });

    </script>
</body>
</html>
