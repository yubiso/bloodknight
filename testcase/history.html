<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Record - BloodKnight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tactical-font { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="text-slate-800 bg-slate-100">

    <div class="flex h-screen overflow-hidden">
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 h-full fixed left-0 top-0 z-20 shadow-sm">
            <div class="p-6 flex items-center gap-3 cursor-pointer hover:bg-slate-50 rounded-lg transition-colors" onclick="window.location.href='dashboard.html'" title="Go to Dashboard">
                <i class="fas fa-shield-alt text-3xl text-red-600"></i>
                <span class="text-2xl font-bold tactical-font uppercase tracking-tighter">Blood<span class="text-red-600">Knight</span></span>
            </div>
            <nav class="flex-1 px-4 py-4 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors">
                    <i class="fas fa-th-large w-5"></i> Dashboard
                </a>
                <a href="find_drives.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors">
                    <i class="fas fa-map-marker-alt w-5"></i> Find Missions
                </a>
                <a href="history.html" class="flex items-center gap-3 px-4 py-3 text-red-600 bg-red-50 rounded-xl font-medium transition-colors">
                    <i class="fas fa-history w-5"></i> History
                </a>
                <a href="bloodreports.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors">
                    <i class="fas fa-file-medical w-5"></i> Blood Reports
                </a>
                <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors">
                    <i class="fas fa-user-cog w-5"></i> Profile
                </a>
            </nav>
            <div class="p-4 mt-auto">
                <button onclick="handleLogout()" class="w-full bg-slate-900 text-white text-xs py-3 px-3 rounded-lg hover:bg-slate-800 transition-colors uppercase font-bold tracking-wider">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 md:ml-64 h-full overflow-y-auto pt-4 md:pt-0 relative">
            <div class="md:hidden px-6 py-4 flex justify-between items-center bg-white border-b mb-4">
                <span class="text-xl font-bold tactical-font uppercase cursor-pointer hover:text-red-600 transition-colors" onclick="window.location.href='dashboard.html'" title="Go to Dashboard">Blood<span class="text-red-600">Knight</span></span>
                <button onclick="handleLogout()" class="text-slate-500"><i class="fas fa-sign-out-alt"></i></button>
            </div>

    <div class="max-w-4xl mx-auto p-6">
        
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Service Record</h1>
            <p class="text-slate-500">A complete log of your contributions and lives saved.</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-semibold tracking-wider">
                        <th class="p-6">Date</th>
                        <th class="p-6">Location</th>
                        <th class="p-6">Volume</th>
                        <th class="p-6 text-right">Impact</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    </tbody>
            </table>
            <div id="loading" class="text-center py-8 text-slate-400">
                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Loading history...</p>
            </div>
        </div>

    </div>
        </main>
    </div>

    <script>
        async function fetchHistory() {
            const tbody = document.getElementById('historyTableBody');
            const loading = document.getElementById('loading');
            let historyData = [];

            try {
                const response = await fetch('bloodknight.php?action=get_history');
                
                if (!response.ok) throw new Error("Backend offline");

                const result = await response.json();
                if (result.status === 'success') {
                    historyData = result.data;
                } else {
                    throw new Error("API Error: " + result.message);
                }

            } catch (error) {
                console.error("Backend unavailable:", error);
                
                // Display error message when backend is offline
                loading.innerHTML = `<i class="fas fa-exclamation-triangle text-2xl mb-2 text-red-500"></i><p class="text-red-500">Failed to load service record from backend.</p>`;
                return;
            }

            // Hide loading spinner
            loading.style.display = 'none';

            // Render Data
            if (historyData.length > 0) {
                tbody.innerHTML = ''; // Clear existing
                historyData.forEach(item => {
                    // Calculate Lives Saved (450ml donation typically saves 3 lives)
                    const livesSaved = Math.floor((item.volume_ml || 0) / 150); 
                    
                    // Format date
                    const donationDate = item.donation_date ? new Date(item.donation_date).toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    }) : 'Date not available';
                    
                    const locationDisplay = item.hospital_name && item.hospital_name !== '' 
                        ? `${item.hospital_name} - ${item.location_name || 'Walk-in Donation'}`
                        : (item.location_name || 'Walk-in Donation');
                    
                    const row = `
                        <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                            <td class="p-6 font-medium text-slate-900">${donationDate}</td>
                            <td class="p-6 text-slate-600">${locationDisplay}</td>
                            <td class="p-6 text-slate-600">${item.volume_ml || 0} ml</td>
                            <td class="p-6 text-right font-bold text-green-600">+${livesSaved} Lives</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-500">No donation history found. Time to save a life!</td></tr>`;
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                fetch('bloodknight.php?action=logout').finally(() => {
                    // Clear local data on logout for clean session start
                    localStorage.removeItem('bk_user_profile');
                    localStorage.removeItem('bk_last_donation');
                    localStorage.removeItem('bk_active_appt');
                    window.location.href = 'index.html';
                });
            }
        }

        // Check authentication
        async function checkAuth() {
            console.log("🔐 ===== AUTHENTICATION CHECK START (History) =====");
            
            // FIRST PRIORITY: Check localStorage - if we have it, ALWAYS allow access
            let savedProfile = null;
            try {
                savedProfile = localStorage.getItem('bk_user_profile');
                if (savedProfile) {
                    console.log("✅ localStorage FOUND - allowing access");
                    return true; // Always allow if localStorage exists
                }
            } catch (e) {
                console.error("❌ localStorage access blocked:", e);
            }
            
            // SECOND PRIORITY: Check session, but be lenient
            try {
                const response = await fetch('bloodknight.php?action=check_session', {
                    credentials: 'same-origin',
                    cache: 'no-cache'
                });
                const result = await response.json();
                if (result.status === 'success') {
                    console.log("✅ Session check successful");
                    return true;
                } else {
                    // Session failed, but be lenient - allow access anyway
                    console.warn("⚠️ Session check failed, but allowing access");
                return true;
                }
            } catch (error) {
                // Network error - be lenient, allow access
                console.warn("⚠️ Auth check error, but allowing access");
                return true;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                fetchHistory();
            }
        });
    </script>
</body>
</html>
