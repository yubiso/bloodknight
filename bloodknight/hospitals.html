<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Locations - BloodKnight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #map { height: calc(100vh - 80px); width: 100%; z-index: 1; }
        .hospital-marker { background: #dc2626; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .custom-popup { max-width: 300px; }
        .custom-popup h3 { font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .custom-popup p { margin: 0.25rem 0; color: #64748b; font-size: 0.9rem; }
        .custom-popup .hospital-type { display: inline-block; background: #fee2e2; color: #dc2626; padding: 0.25rem 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; margin-top: 0.5rem; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .hospital-list { max-height: calc(100vh - 80px); overflow-y: auto; }
        .hospital-item { cursor: pointer; transition: all 0.2s; }
        .hospital-item:hover { background: #f1f5f9; transform: translateX(4px); }
    </style>
</head>
<body class="bg-slate-50">
    
    <!-- Navigation -->
    <nav class="w-full bg-white border-b border-slate-200 px-6 py-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <i class="fas fa-shield-alt text-red-600 text-2xl"></i>
                <span class="text-xl font-bold text-slate-800 tracking-tight">BloodKnight</span>
            </a>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-sm font-medium text-slate-600 hover:text-red-600">Home</a>
                <a href="find_drives.html" class="text-sm font-medium text-slate-600 hover:text-red-600">Find Drives</a>
                <a href="hospitals.html" class="text-sm font-bold text-red-600">Hospitals</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex">
        <!-- Sidebar with Hospital List -->
        <div class="w-80 bg-white border-r border-slate-200 p-4 hidden lg:block">
            <div class="mb-4">
                <h2 class="text-xl font-bold text-slate-900 mb-2">Hospitals</h2>
                <p class="text-sm text-slate-500">Click on a hospital to view on map</p>
            </div>
            <div id="hospital-list" class="hospital-list space-y-2">
                <!-- Hospitals will be loaded here -->
            </div>
        </div>

        <!-- Map Container -->
        <div class="flex-1 relative">
            <div id="map"></div>
            
            <!-- Loading Overlay -->
            <div id="loading-overlay" class="loading-overlay">
                <i class="fas fa-spinner fa-spin text-red-600 text-4xl mb-4"></i>
                <p class="text-slate-600 font-medium">Loading hospitals...</p>
            </div>

            <!-- Mobile Toggle Button -->
            <button id="toggle-sidebar" class="lg:hidden fixed top-24 left-4 z-50 bg-white border border-slate-200 rounded-lg p-2 shadow-lg hover:bg-slate-50 transition-colors">
                <i class="fas fa-list text-slate-700"></i>
            </button>

            <!-- Mobile Sidebar -->
            <div id="mobile-sidebar" class="lg:hidden fixed top-20 left-0 right-0 bottom-0 bg-white z-40 transform translate-x-full transition-transform duration-300 overflow-y-auto p-4">
                <div class="mb-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-900">Hospitals</h2>
                    <button id="close-mobile-sidebar" class="text-slate-500 hover:text-slate-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="mobile-hospital-list" class="space-y-2">
                    <!-- Hospitals will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];
        let hospitals = [];

        // Initialize Map (Sabah, Malaysia - approximate center)
        // Sabah, Malaysia bounds
        const sabahBounds = L.latLngBounds(
            [4.0, 115.0],  // Southwest corner (South, West)
            [7.5, 119.5]   // Northeast corner (North, East)
        );

        map = L.map('map', {
            maxBounds: sabahBounds,
            maxBoundsViscosity: 1.0, // Prevent panning outside bounds
            minZoom: 8,  // Minimum zoom level to keep Sabah visible
            maxZoom: 16  // Maximum zoom level
        }).setView([5.9804, 116.0735], 10); // Center on Kota Kinabalu

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Restrict map to Sabah bounds
        map.setMaxBounds(sabahBounds);

        // Hardcoded coordinates for known Sabah hospitals (fallback)
        const hospitalCoordinates = {
            'Queen Elizabeth Hospital': { lat: 5.9764, lon: 116.0708 },
            'KPJ Sabah Specialist Hospital': { lat: 5.9789, lon: 116.0756 },
            'Gleneagles Kota Kinabalu': { lat: 5.9372, lon: 116.0528 },
            'Sabah Women and Children Hospital': { lat: 6.0125, lon: 116.1000 },
            'Tawau Hospital': { lat: 4.2448, lon: 117.8912 },
            'Sandakan Hospital': { lat: 5.8388, lon: 118.1173 },
            'Keningau Hospital': { lat: 5.3378, lon: 116.1600 },
            'Lahad Datu Hospital': { lat: 5.0267, lon: 118.3250 },
            'Beaufort Hospital': { lat: 5.3456, lon: 115.7456 },
            'Pantai Hospital Likas': { lat: 6.0125, lon: 116.1000 }
        };

        // Geocode address to coordinates using Nominatim
        async function geocodeAddress(address, hospitalName) {
            // First check if we have hardcoded coordinates
            if (hospitalName && hospitalCoordinates[hospitalName]) {
                console.log(`Using hardcoded coordinates for: ${hospitalName}`);
                return hospitalCoordinates[hospitalName];
            }

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', Sabah, Malaysia')}&limit=1`, {
                    headers: {
                        'User-Agent': 'BloodKnight Hospital Map'
                    }
                });
                const data = await response.json();
                if (data && data.length > 0) {
                    return {
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon)
                    };
                }
            } catch (error) {
                console.error('Geocoding error:', error);
            }
            return null;
        }

        // Create custom icon
        function createHospitalIcon() {
            return L.divIcon({
                className: 'hospital-marker',
                html: '<i class="fas fa-hospital"></i>',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });
        }

        // Add marker to map
        function addHospitalMarker(hospital, coordinates) {
            if (!coordinates) return null;

            const popupContent = `
                <div class="custom-popup">
                    <h3>${hospital.hospital_name}</h3>
                    <p><i class="fas fa-map-marker-alt text-red-600 mr-2"></i>${hospital.hospital_address}</p>
                    ${hospital.contact_number ? `<p><i class="fas fa-phone text-red-600 mr-2"></i>${hospital.contact_number}</p>` : ''}
                    <span class="hospital-type">${hospital.hospital_type}</span>
                </div>
            `;

            const marker = L.marker([coordinates.lat, coordinates.lon], {
                icon: createHospitalIcon()
            }).addTo(map).bindPopup(popupContent);

            marker.hospitalData = hospital;
            return marker;
        }

        // Load hospitals and geocode
        async function loadHospitals() {
            const loadingEl = document.getElementById('loading-overlay');
            
            try {
                const response = await fetch('bloodknight.php?action=get_hospitals');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                const result = await response.json();
                console.log('API Response:', result);

                if (result.status === 'success' && result.data) {
                    hospitals = result.data;
                    console.log('Hospitals loaded from API:', hospitals.length);
                    
                    if (hospitals.length === 0) {
                        if (loadingEl) {
                            loadingEl.querySelector('p').innerHTML = 'No hospitals found in database.<br><small style="font-size: 0.85em; color: #64748b;">Please add hospitals to the system first.</small>';
                            loadingEl.querySelector('p').style.color = '#dc2626';
                        }
                        setTimeout(() => {
                            if (loadingEl) loadingEl.style.display = 'none';
                        }, 5000);
                        return;
                    }
                    
                    renderHospitalList();
                    
                    // Geocode and add markers (limit to first 15 for performance)
                    let geocodedCount = 0;
                    let successCount = 0;
                    const hospitalsToProcess = hospitals.slice(0, 15);
                    const totalHospitals = hospitalsToProcess.length;

                    // Add delay between geocoding requests to respect rate limits
                    for (const hospital of hospitalsToProcess) {
                        // Add delay to respect Nominatim rate limits (1 request per second)
                        if (geocodedCount > 0) {
                            await new Promise(resolve => setTimeout(resolve, 1100));
                        }
                        
                        const coordinates = await geocodeAddress(hospital.hospital_address, hospital.hospital_name);
                        geocodedCount++;
                        
                        if (coordinates) {
                            // Check if coordinates are within Sabah bounds
                            if (sabahBounds.contains([coordinates.lat, coordinates.lon])) {
                                const marker = addHospitalMarker(hospital, coordinates);
                                if (marker) {
                                    markers.push(marker);
                                    successCount++;
                                    console.log(`Added marker for: ${hospital.hospital_name}`, coordinates);
                                }
                            } else {
                                console.warn(`Hospital ${hospital.hospital_name} coordinates outside Sabah bounds:`, coordinates);
                            }
                        } else {
                            console.warn(`Failed to geocode: ${hospital.hospital_name} - ${hospital.hospital_address}`);
                        }
                        
                        // Update loading message
                        if (loadingEl) {
                            loadingEl.querySelector('p').textContent = `Loading hospitals... (${geocodedCount}/${totalHospitals}) - Found ${successCount} locations`;
                        }
                    }

                    // Fit map to show all markers
                    if (markers.length > 0) {
                        const group = new L.featureGroup(markers);
                        const bounds = group.getBounds();
                        
                        // Ensure bounds are within Sabah
                        const clampedBounds = L.latLngBounds(
                            [
                                Math.max(bounds.getSouth(), sabahBounds.getSouth()),
                                Math.max(bounds.getWest(), sabahBounds.getWest())
                            ],
                            [
                                Math.min(bounds.getNorth(), sabahBounds.getNorth()),
                                Math.min(bounds.getEast(), sabahBounds.getEast())
                            ]
                        );
                        
                        map.fitBounds(clampedBounds.pad(0.15), {
                            maxZoom: 12
                        });
                        
                        // Hide loading overlay
                        if (loadingEl) {
                            loadingEl.style.display = 'none';
                        }
                    } else {
                        // No markers found
                        if (loadingEl) {
                            loadingEl.querySelector('p').textContent = 'No hospital locations found. Please check if hospitals exist in database.';
                            loadingEl.querySelector('p').style.color = '#dc2626';
                        }
                        console.warn('No markers were added to the map');
                    }
                } else {
                    // No hospitals in response
                    const errorMsg = result.message || 'No hospitals found in database';
                    console.error('API Error:', errorMsg);
                    if (loadingEl) {
                        loadingEl.querySelector('p').textContent = errorMsg;
                        loadingEl.querySelector('p').style.color = '#dc2626';
                    }
                    setTimeout(() => {
                        if (loadingEl) {
                            loadingEl.style.display = 'none';
                        }
                    }, 3000);
                }
            } catch (error) {
                console.error('Error loading hospitals:', error);
                if (loadingEl) {
                    loadingEl.querySelector('p').textContent = 'Error loading hospitals: ' + error.message + '. Please refresh.';
                    loadingEl.querySelector('p').style.color = '#dc2626';
                }
            }
        }

        // Render hospital list
        function renderHospitalList() {
            const listContainer = document.getElementById('hospital-list');
            const mobileListContainer = document.getElementById('mobile-hospital-list');
            
            if (!listContainer || !mobileListContainer) return;

            listContainer.innerHTML = '';
            mobileListContainer.innerHTML = '';

            hospitals.forEach((hospital, index) => {
                const item = document.createElement('div');
                item.className = 'hospital-item bg-white border border-slate-200 rounded-lg p-3 hover:shadow-md';
                item.innerHTML = `
                    <h3 class="font-bold text-slate-900 text-sm mb-1">${hospital.hospital_name}</h3>
                    <p class="text-xs text-slate-500 mb-2 line-clamp-2">${hospital.hospital_address}</p>
                    <div class="flex items-center justify-between">
                        <span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded font-semibold">${hospital.hospital_type}</span>
                        ${hospital.contact_number ? `<span class="text-xs text-slate-400"><i class="fas fa-phone"></i> ${hospital.contact_number}</span>` : ''}
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    // Find corresponding marker and open popup
                    const marker = markers.find(m => m.hospitalData && m.hospitalData.hospital_id === hospital.hospital_id);
                    if (marker) {
                        map.setView(marker.getLatLng(), 15);
                        marker.openPopup();
                    }
                });

                listContainer.appendChild(item.cloneNode(true));
                mobileListContainer.appendChild(item);
            });
        }

        // Mobile sidebar toggle
        document.getElementById('toggle-sidebar')?.addEventListener('click', () => {
            document.getElementById('mobile-sidebar').classList.remove('translate-x-full');
        });

        document.getElementById('close-mobile-sidebar')?.addEventListener('click', () => {
            document.getElementById('mobile-sidebar').classList.add('translate-x-full');
        });

        // Initialize
        loadHospitals();
    </script>
</body>
</html>
